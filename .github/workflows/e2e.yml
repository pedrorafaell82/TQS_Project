name: E2E Tests

on:
  push:
    branches:
      - main
      - master
      - development
  pull_request:
    branches:
      - main
      - master
      - development
  workflow_dispatch:

jobs:
  selenium-tests:
    name: Selenium E2E Tests (${{ matrix.browser }})
    runs-on: ubuntu-latest
    
    strategy:
      matrix:
        browser: [chrome, firefox]
      fail-fast: false
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      
      - name: Setup Chrome
        if: matrix.browser == 'chrome'
        uses: browser-actions/setup-chrome@latest
      
      - name: Setup Firefox
        if: matrix.browser == 'firefox'
        uses: browser-actions/setup-firefox@latest
      
      - name: Install ChromeDriver
        if: matrix.browser == 'chrome'
        uses: nanasess/setup-chromedriver@v2
      
      - name: Install GeckoDriver
        if: matrix.browser == 'firefox'
        uses: browser-actions/setup-geckodriver@latest
      
      - name: Start Backend
        run: |
          cd backend
          mvn spring-boot:run > backend.log 2>&1 &
          echo $! > backend.pid
          echo "Waiting for backend to start..."
          sleep 30
          
      - name: Start Frontend
        run: |
          cd frontend
          npm install
          npm run dev > frontend.log 2>&1 &
          echo $! > frontend.pid
          echo "Waiting for frontend to start..."
          sleep 15
      
      - name: Verify Services
        run: |
          echo "Checking backend..."
          curl -f http://localhost:8080/actuator/health || curl -f http://localhost:8080 || echo "Backend may not be ready"
          echo "Checking frontend..."
          curl -f http://localhost:5173 || echo "Frontend may not be ready"
      
      - name: Run Selenium Tests
        run: |
          cd selenium-tests
          mvn -B clean test -Dbrowser=${{ matrix.browser }}
        env:
          BROWSER: ${{ matrix.browser }}
      
      - name: Stop Services
        if: always()
        run: |
          if [ -f backend/backend.pid ]; then
            kill $(cat backend/backend.pid) || true
          fi
          if [ -f frontend/frontend.pid ]; then
            kill $(cat frontend/frontend.pid) || true
          fi
      
      - name: Upload Test Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: selenium-test-reports-${{ matrix.browser }}
          path: selenium-tests/target/surefire-reports/
      
      - name: Upload Screenshots
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: selenium-screenshots-${{ matrix.browser }}
          path: selenium-tests/screenshots/
      
      - name: Upload Logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: application-logs-${{ matrix.browser }}
          path: |
            backend/backend.log
            frontend/frontend.log
